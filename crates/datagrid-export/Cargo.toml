[package]
name = "datagrid-export"
version = "0.12.0"
description = "Writes a data grid's rows as CSV or an HTML table to print, from the table datagrid-core builds."
keywords = ["datagrid", "table", "export", "csv"]
categories = ["data-structures", "encoding"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
datagrid-core.workspace = true

[features]
default = ["csv", "html"]
# CSV needs no dependency at all.
csv = []
# An HTML table, for printing; no dependency either.
html = []
# Dates and times as cell values, written in ISO 8601.
chrono = ["datagrid-core/chrono"]

[lints]
workspace = true
