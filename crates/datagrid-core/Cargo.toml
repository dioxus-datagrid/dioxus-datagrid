[package]
name = "datagrid-core"
version = "0.5.0"
description = "Framework-agnostic sorting, filtering, paging, selection and virtualization logic for data grids."
keywords = ["datagrid", "table", "sorting", "filtering", "virtualization"]
categories = ["gui", "data-structures"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
# Dates and times in `CellValue` and their formatting. `alloc` for `format`.
chrono = { version = "0.4.45", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
serde = ["dep:serde", "chrono?/serde"]
chrono = ["dep:chrono"]

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.7"
serde_json = "1.0.151"

[[bench]]
name = "compute_view"
harness = false

[lints]
workspace = true
