name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features turns on the playground's desktop feature, which builds
      # against the system WebView.
      - name: Install Linux WebView dependencies
        run: ./scripts/install-linux-webview-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux WebView dependencies
        run: ./scripts/install-linux-webview-deps.sh
      - run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p dioxus-datagrid --target wasm32-unknown-unknown

  # Cargo unifies features: another crate in an app can turn on `chrono` in
  # datagrid-core while dioxus-datagrid's own `chrono` stays off. Both crates
  # must compile in every mix of the two.
  feature-mix:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p datagrid-core --no-default-features
      - run: cargo check -p dioxus-datagrid --no-default-features
      - run: cargo check -p dioxus-datagrid --features datagrid-core/chrono
      - run: cargo check -p dioxus-datagrid --features datagrid-core/serde

  platform-build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/install-linux-webview-deps.sh
      - run: cargo check -p playground --no-default-features --features desktop

  no-web-sys:
    name: web-sys guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dioxus-datagrid must stay platform neutral: no web-sys in its normal
      # dependency tree, so the same code runs on desktop and mobile WebViews.
      - name: Assert web-sys is absent
        run: |
          if cargo tree -p dioxus-datagrid -e normal | grep -q web-sys; then
            echo "::error::web-sys leaked into the dioxus-datagrid dependency tree"
            cargo tree -p dioxus-datagrid -e normal | grep -B5 web-sys
            exit 1
          fi
          echo "web-sys is absent, as required"
